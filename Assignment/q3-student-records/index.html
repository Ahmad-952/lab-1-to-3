<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>

    <div class="container">

        <h1>Student Records</h1>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Roll No</th>
                    <th>Marks</th>
                    <th>Grade</th>
                </tr>
            </thead>

            <tbody id="studentTable">
            </tbody>
        </table>

        <div class="summary">
            <p id="average"></p>
            <p id="topScorer"></p>
        </div>

        <button id="sortBtn">Sort by Marks (High → Low)</button>

    </div>

</body>
</html>
