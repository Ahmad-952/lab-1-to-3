<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>

    <div class="container">
        <h1>Temperature Converter</h1>

        <label for="temperature">Enter Temperature</label>
        <input type="text" id="temperature" placeholder="e.g. 36.6">

        <div class="buttons">
            <button id="toFahrenheit">To °F</button>
            <button id="toCelsius">To °C</button>
        </div>

        <div id="result"></div>
    </div>

</body>
</html>
